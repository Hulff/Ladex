[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabconv"
version = "0.1.0"
description = "Offline tabular text converter"
requires-python = ">=3.11"
dependencies = ["charset-normalizer>=3.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6.10"]

[project.scripts]
tabconv = "tabconv.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tabconv"]
